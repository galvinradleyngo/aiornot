<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Use Case Review Worksheet</title>
<style>
  :root{
    --navy:#1f3a5f;
    --navy-dark:#152a45;
    --navy-light:#eaf0f7;
    --gold:#8a6d1f;
    --gold-light:#faf3df;
    --risk:#8f2d2d;
    --risk-light:#fbeaea;
    --opp:#1f6d3d;
    --opp-light:#e9f5ed;
    --ink:#1f2530;
    --muted:#68707c;
    --border:#e1e5ea;
    --bg:#f6f7f9;
    --card:#ffffff;
    --radius:10px;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.55;
    font-size:16px;
    display:flex;
    flex-direction:column;
    min-height:100%;
  }
  h1,h2,h3{line-height:1.25;margin:0 0 .4em;}
  p{margin:0 0 .6em;}
  button{font-family:inherit;}

  /* ---------- Header ---------- */
  .app-header{
    background:var(--navy);
    color:#fff;
    padding:16px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  .app-header h1{font-size:1.15rem;font-weight:600;letter-spacing:.2px;}
  .app-header .subtitle{font-size:.82rem;color:#c9d6e6;margin-top:2px;}
  .header-left{display:flex;align-items:center;gap:12px;min-width:0;}
  .header-titles{display:flex;flex-direction:column;min-width:0;}
  .btn-ghost{
    background:transparent;
    border:1px solid rgba(255,255,255,.5);
    color:#fff;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
    font-size:.85rem;
    white-space:nowrap;
  }
  .btn-ghost:hover{background:rgba(255,255,255,.12);}
  .sidebar-toggle-btn{
    background:transparent;
    border:1px solid rgba(255,255,255,.5);
    color:#fff;
    width:36px;height:36px;
    border-radius:8px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-size:1.05rem;
    flex-shrink:0;
  }
  .sidebar-toggle-btn:hover{background:rgba(255,255,255,.12);}

  /* ---------- Sidebar (review snapshot) ---------- */
  .app-body{display:flex;align-items:flex-start;flex:1;width:100%;}
  .sidebar{
    background:#fff;
    overflow-y:auto;
    overflow-x:hidden;
    flex-shrink:0;
    transition:width .22s ease,transform .22s ease;
  }
  .sidebar-inner{width:280px;padding:20px;}
  @media (max-width:880px){
    .sidebar{
      position:fixed;
      top:0;left:0;bottom:0;
      width:280px;
      transform:translateX(-100%);
      z-index:45;
      box-shadow:0 10px 40px rgba(0,0,0,.2);
      border-right:1px solid var(--border);
    }
    .sidebar.open{transform:translateX(0);}
  }
  @media (min-width:881px){
    .sidebar{
      position:sticky;
      width:0;
      border-right:1px solid var(--border);
    }
    .sidebar.open{width:280px;}
  }
  .sidebar-scrim{
    display:none;
    position:fixed;inset:0;
    background:rgba(15,23,35,.4);
    z-index:40;
  }
  .sidebar-scrim.show{display:block;}
  @media (min-width:881px){ .sidebar-scrim{display:none !important;} }
  .sidebar-header{
    display:flex;align-items:center;justify-content:space-between;
    padding-bottom:14px;margin-bottom:16px;
    border-bottom:1px solid var(--border);
  }
  .sidebar-kicker{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);}
  .sidebar-close{display:none;background:none;border:none;font-size:1.3rem;line-height:1;color:var(--muted);cursor:pointer;padding:2px 6px;}
  @media (max-width:880px){ .sidebar-close{display:block;} }
  .sidebar-block{margin-bottom:22px;}
  .sidebar-block:last-child{margin-bottom:0;}
  .sidebar-label{display:block;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:8px;}
  .sidebar-usecase{
    display:block;width:100%;text-align:left;
    font-size:.83rem;color:var(--ink);line-height:1.4;
    background:var(--bg);border:1px solid var(--border);border-radius:8px;
    padding:10px 12px;cursor:pointer;font-family:inherit;
  }
  .sidebar-usecase:hover{border-color:var(--navy);}
  .sidebar-empty{font-size:.82rem;color:var(--muted);font-style:italic;}
  .sidebar-list{display:flex;flex-direction:column;gap:6px;}
  .sidebar-item{
    display:flex;align-items:center;gap:8px;
    width:100%;text-align:left;font-family:inherit;
    background:#fff;border:1px solid var(--border);border-left:3px solid var(--border);
    border-radius:6px;padding:6px 10px;
    font-size:.82rem;color:var(--ink);cursor:pointer;
  }
  .sidebar-item.risk{border-left-color:var(--risk);}
  .sidebar-item.opp{border-left-color:var(--opp);}
  .sidebar-item:hover{background:var(--bg);}
  .sidebar-badge{flex-shrink:0;font-size:.6rem;padding:1px 7px;}
  .sidebar-item-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sidebar-decision-chip{
    display:block;width:100%;text-align:left;font-family:inherit;
    padding:8px 12px;border-radius:8px;border:1px solid var(--border);
    font-size:.82rem;font-weight:700;cursor:pointer;background:#fff;color:var(--ink);
  }
  .sidebar-decision-chip.to-ai{border-color:var(--navy);background:var(--navy-light);color:var(--navy);}
  .sidebar-decision-chip.not-ai{border-color:#4b5563;background:#f1f2f4;color:#374151;}
  .sidebar-decision-chip.guardrails{border-color:var(--gold);background:var(--gold-light);color:#725817;}
  .sidebar-guardrail{margin-top:8px;font-size:.8rem;color:var(--muted);line-height:1.4;}

  /* ---------- Progress ---------- */
  .progress-wrap{
    position:sticky;
    top:0;
    z-index:5;
    background:#fff;
    border-bottom:1px solid var(--border);
    padding:14px 24px 10px;
  }
  .progress-track{
    height:6px;
    background:var(--border);
    border-radius:99px;
    overflow:hidden;
    max-width:900px;
    margin:0 auto 12px;
  }
  .progress-fill{
    height:100%;
    background:var(--navy);
    transition:width .25s ease;
  }
  .progress-steps{
    max-width:900px;
    margin:0 auto;
    display:flex;
    justify-content:space-between;
    gap:4px;
  }
  .progress-step{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    flex:1;
    text-align:center;
  }
  .progress-step .dot{
    width:26px;height:26px;border-radius:50%;
    background:#fff;border:2px solid var(--border);
    color:var(--muted);
    display:flex;align-items:center;justify-content:center;
    font-size:.78rem;font-weight:600;
  }
  .progress-step .label{font-size:.72rem;color:var(--muted);font-weight:500;}
  .progress-step.current .dot{border-color:var(--navy);color:var(--navy);background:var(--navy-light);}
  .progress-step.current .label{color:var(--navy);font-weight:700;}
  .progress-step.done .dot{background:var(--navy);border-color:var(--navy);color:#fff;}
  .progress-step.done .label{color:var(--ink);}
  .progress-text{display:none;}

  /* ---------- Main ---------- */
  .step-container{
    flex:1;
    min-width:0;
    max-width:900px;
    width:100%;
    margin:0 auto;
    padding:28px 24px 60px;
  }
  .step-heading{margin-bottom:6px;}
  .step-intro{color:var(--muted);margin-bottom:22px;font-size:.96rem;}

  .field-group{margin-bottom:20px;}
  label.field-label{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px;}
  .field-hint{font-size:.8rem;color:var(--muted);margin-top:4px;}
  input[type="text"],input[type="date"],textarea{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:.95rem;
    font-family:inherit;
    background:#fff;
    color:var(--ink);
  }
  input[type="text"]:focus,input[type="date"]:focus,textarea:focus{
    outline:2px solid var(--navy);
    outline-offset:1px;
    border-color:var(--navy);
  }
  textarea{resize:vertical;min-height:96px;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  @media (max-width:560px){.two-col{grid-template-columns:1fr;}}

  /* ---------- Item cards (risks/opportunities) ---------- */
  .item-card{
    background:var(--card);
    border:1px solid var(--border);
    border-left:4px solid transparent;
    border-radius:var(--radius);
    padding:14px 18px;
    margin-bottom:12px;
    transition:background .15s ease,border-color .15s ease;
  }
  .item-card.risk{--accent:var(--risk);--accent-light:var(--risk-light);}
  .item-card.opp{--accent:var(--opp);--accent-light:var(--opp-light);}
  .item-card.applied{border-left-color:var(--accent);background:var(--accent-light);}
  .item-head{
    display:flex;
    align-items:flex-start;
    gap:10px;
    cursor:pointer;
    font-weight:600;
  }
  .item-head input[type="checkbox"]{margin-top:3px;width:18px;height:18px;flex-shrink:0;accent-color:var(--accent,var(--navy));cursor:pointer;}
  .item-num{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:22px;height:22px;border-radius:50%;
    background:var(--border);color:var(--muted);
    font-size:.72rem;font-weight:700;flex-shrink:0;
  }
  .item-card.applied .item-num{background:var(--accent);color:#fff;}
  .item-title{font-size:.98rem;}
  .item-body{
    margin:6px 0 0 32px;
    font-size:.88rem;
    color:var(--muted);
  }
  .item-card.applied .item-body{color:var(--ink);}
  .item-detail{
    margin:14px 0 2px 32px;
    padding-top:12px;
    border-top:1px dashed var(--border);
  }
  .seg-group{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;position:relative;}
  .seg-label{font-size:.82rem;font-weight:600;color:var(--muted);margin-right:2px;}
  .sr-radio{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none;}
  .seg-btn{
    padding:5px 14px;
    border-radius:99px;
    border:1px solid var(--border);
    background:#fff;
    font-size:.82rem;
    font-weight:600;
    cursor:pointer;
    color:var(--muted);
    user-select:none;
  }
  .sr-radio:focus-visible + .seg-btn{outline:2px solid var(--navy);outline-offset:1px;}
  .sr-radio:checked + .seg-btn{color:#fff;border-color:var(--accent);background:var(--accent);}
  .notes-label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:5px;}
  .notes-input{background:#fff;}

  /* ---------- Decision step ---------- */
  .summary-box{
    background:var(--navy-light);
    border:1px solid #cddaea;
    border-radius:var(--radius);
    padding:16px 18px;
    margin-bottom:24px;
    font-size:.92rem;
  }
  .summary-box strong{color:var(--navy);}
  .summary-box .disclaimer{display:block;margin-top:8px;font-size:.8rem;color:var(--muted);font-style:italic;}
  .decision-cards{display:flex;flex-direction:column;gap:14px;margin-bottom:20px;}
  .decision-card{
    border:2px solid var(--border);
    border-radius:var(--radius);
    padding:16px 18px;
    cursor:pointer;
    background:#fff;
    transition:border-color .15s ease,background .15s ease;
  }
  .decision-card:hover{border-color:#b8c2ce;}
  .decision-card h3{font-size:1rem;display:flex;align-items:center;gap:8px;}
  .decision-card p{font-size:.88rem;color:var(--muted);margin:4px 0 0;}
  .decision-card.to-ai{border-left:5px solid var(--navy);}
  .decision-card.not-ai{border-left:5px solid #4b5563;}
  .decision-card.guardrails{border-left:5px solid var(--gold);}
  .decision-card.selected{background:var(--gold-light);border-color:var(--gold);}
  .decision-card.selected.to-ai{background:var(--navy-light);border-color:var(--navy);}
  .decision-card.selected.not-ai{background:#f1f2f4;border-color:#4b5563;}
  .decision-check{display:inline-flex;width:18px;height:18px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;align-items:center;justify-content:center;font-size:.7rem;color:#fff;}
  .decision-card.selected .decision-check{background:var(--gold);border-color:var(--gold);}
  .decision-card.selected.to-ai .decision-check{background:var(--navy);border-color:var(--navy);}
  .decision-card.selected.not-ai .decision-check{background:#4b5563;border-color:#4b5563;}
  .guardrail-field{
    background:var(--gold-light);
    border:1px solid #e3d6a8;
    border-radius:var(--radius);
    padding:16px 18px;
    margin-top:6px;
  }
  .guardrail-field label{color:var(--gold);}

  /* ---------- Validation ---------- */
  .validation-msg{
    color:var(--risk);
    font-size:.85rem;
    font-weight:600;
    margin-right:auto;
    padding-left:4px;
  }

  /* ---------- Footer nav ---------- */
  .wizard-footer{
    position:sticky;
    bottom:0;
    background:#fff;
    border-top:1px solid var(--border);
    padding:14px 24px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .wizard-footer-inner{max-width:900px;margin:0 auto;width:100%;display:flex;align-items:center;gap:12px;}
  .btn{
    padding:10px 20px;
    border-radius:8px;
    border:1px solid transparent;
    font-size:.92rem;
    font-weight:600;
    cursor:pointer;
  }
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-primary:hover{background:var(--navy-dark);}
  .btn-secondary{background:#fff;color:var(--navy);border-color:var(--navy);}
  .btn-secondary:hover{background:var(--navy-light);}
  .btn-secondary:disabled{opacity:.4;cursor:not-allowed;}
  .btn-gold{background:var(--gold);color:#fff;}
  .btn-gold:hover{background:#725817;}
  .spacer{flex:1;}

  /* ---------- Report ---------- */
  .report-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;}
  .report-page{
    background:#fff;
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:32px 36px;
  }
  .report-page h2{font-size:1.4rem;color:var(--navy);}
  .report-meta{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px 24px;
    margin:18px 0 22px;
    padding-bottom:18px;
    border-bottom:1px solid var(--border);
  }
  .report-meta .full{grid-column:1/-1;}
  .report-meta .k{font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;margin-bottom:2px;}
  .report-meta .v{font-size:.95rem;white-space:pre-wrap;}
  .report-summary{
    background:var(--navy-light);
    border-radius:8px;
    padding:14px 16px;
    font-size:.9rem;
    margin-bottom:26px;
  }
  .report-section{margin-bottom:26px;}
  .report-section h3{
    font-size:.95rem;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--muted);
    border-bottom:2px solid var(--border);
    padding-bottom:6px;
    margin-bottom:14px;
  }
  .report-item{
    border-left:3px solid var(--border);
    padding:4px 0 4px 14px;
    margin-bottom:12px;
  }
  .report-item.risk{border-left-color:var(--risk);}
  .report-item.opp{border-left-color:var(--opp);}
  .report-item-title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.95rem;}
  .badge{
    display:inline-block;
    font-size:.68rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.03em;
    padding:2px 9px;
    border-radius:99px;
    color:#fff;
  }
  .badge.high{background:var(--risk);}
  .badge.med{background:var(--gold);}
  .badge.low{background:#6b7280;}
  .report-item-notes{font-size:.87rem;color:var(--muted);margin-top:3px;}
  .empty-note{color:var(--muted);font-size:.88rem;font-style:italic;}
  .decision-report-box{
    border:1px solid var(--border);
    border-left:5px solid var(--gold);
    border-radius:8px;
    padding:16px 18px;
    background:var(--gold-light);
  }
  .decision-report-box h4{font-size:1.05rem;color:var(--navy);margin-bottom:4px;}
  .guardrail-callout{
    margin-top:12px;
    padding-top:12px;
    border-top:1px dashed #d9c98d;
    font-size:.9rem;
  }
  .guardrail-callout .k{font-weight:700;color:var(--gold);display:block;margin-bottom:3px;font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(15,23,35,.55);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .modal-box{
    background:#fff;border-radius:12px;max-width:440px;width:100%;
    padding:26px 28px;box-shadow:0 20px 50px rgba(0,0,0,.25);
  }
  .modal-box h2{font-size:1.1rem;color:var(--navy);}
  .modal-box p{color:var(--muted);font-size:.9rem;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;bottom:26px;left:50%;transform:translateX(-50%);
    background:var(--navy);color:#fff;padding:10px 20px;border-radius:8px;
    font-size:.88rem;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.2);
  }

  [hidden]{display:none !important;}

  /* ---------- Print ---------- */
  @media print{
    .no-print{display:none !important;}
    body{background:#fff;}
    .step-container{max-width:100%;padding:0;margin:0;}
    .report-page{border:none;border-radius:0;padding:0;}
    .badge{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .report-summary{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .decision-report-box{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    @page{margin:1.6cm;}
  }
</style>
</head>
<body>

  <div id="resumeModal" class="modal-overlay" hidden>
    <div class="modal-box">
      <h2>Resume your review?</h2>
      <p>We found a review in progress from earlier. Would you like to pick up where you left off, or start fresh?</p>
      <div class="modal-actions">
        <button class="btn btn-primary" id="resumeBtn">Resume where I left off</button>
        <button class="btn btn-secondary" id="startFreshBtn">Start a new review</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <header class="app-header no-print">
    <div class="header-left">
      <button class="sidebar-toggle-btn" id="sidebarToggle" type="button" aria-label="Toggle review snapshot" aria-expanded="false">&#9776;</button>
      <div class="header-titles">
        <h1>AI Use Case Review Worksheet</h1>
        <span class="subtitle">Think it through before you decide to AI, not to AI, or AI with guardrails.</span>
      </div>
    </div>
    <button class="btn-ghost" id="headerResetBtn" type="button">Start New Review</button>
  </header>

  <div class="progress-wrap no-print" id="progressWrap"></div>

  <div class="app-body">
    <div class="sidebar-scrim no-print" id="sidebarScrim"></div>
    <aside class="sidebar no-print" id="sidebar">
      <div class="sidebar-inner" id="sidebarInner"></div>
    </aside>
    <main class="step-container" id="stepContainer"></main>
  </div>

  <footer class="wizard-footer no-print">
    <div class="wizard-footer-inner">
      <button class="btn btn-secondary" id="backBtn" type="button">Back</button>
      <span class="validation-msg" id="validationMsg"></span>
      <div class="spacer"></div>
      <button class="btn btn-primary" id="nextBtn" type="button">Next</button>
    </div>
  </footer>

<script>
(function(){
  "use strict";

  var RISKS = [
    {n:1,title:"Bias & Discrimination", body:"AI systems trained on historical data can replicate and even amplify existing inequities — disadvantaging people by race, gender, ability, language, or background."},
    {n:2,title:"Hallucination", body:"AI can generate false or fabricated information with total confidence, presenting it as verified fact."},
    {n:3,title:"Sycophancy", body:"AI tends to tell you what you want to hear rather than what's accurate — reinforcing your existing assumptions instead of challenging them."},
    {n:4,title:"Privacy & Data Exposure", body:"Sensitive information typed into an AI tool may be stored, reused to train the model, or exposed to people it was never meant for."},
    {n:5,title:"Accountability Gap", body:"When AI contributes to a decision or a piece of work, it can become unclear who is actually responsible if something goes wrong."},
    {n:6,title:"The Black Box", body:"AI's reasoning often isn't explainable — making it hard to justify a decision or an output to the people affected by it."},
    {n:7,title:"Over-Reliance & De-skilling", body:"Leaning on AI too heavily can quietly erode your own judgment, expertise, and ability to do the work without it."},
    {n:8,title:"Loss of Human Trust", body:"People can feel disrespected or unheard when AI replaces genuine human attention and effort in something that used to involve a person."},
    {n:9,title:"Security Vulnerability", body:"AI systems can be hacked, manipulated, or “jailbroken” into producing harmful, incorrect, or unauthorized outputs."},
    {n:10,title:"Homogenization", body:"Widespread AI use can flatten the diversity of ideas, voice, and style across a group or organization."},
    {n:11,title:"Legal & Regulatory Liability", body:"Using AI in certain ways can violate data protection laws, intellectual property rights, or an organization's own policies — creating real legal exposure."},
    {n:12,title:"Reputational Damage", body:"A single visible AI failure — a biased outcome, a factual error, a data leak — can damage trust and credibility fast."},
    {n:13,title:"Cognitive Surrender", body:"It's easy to stop thinking something through yourself and simply defer to whatever the AI says — even on calls that deserve real scrutiny."},
    {n:14,title:"Environmental Impact", body:"Training and running AI models consumes real energy and water, adding measurable strain to data centers and the environment."}
  ];

  var OPPORTUNITIES = [
    {n:1,title:"Time & Efficiency", body:"AI can complete routine or high-volume tasks far faster than manual work, freeing up real time for what actually needs a person."},
    {n:2,title:"Scale & Reach", body:"AI can support or serve far more people at once than any individual or team could manage alone."},
    {n:3,title:"24/7 Availability", body:"AI can provide help, answers, or support outside normal working hours, any day of the week."},
    {n:4,title:"Personalization", body:"AI can tailor its output, pace, or recommendations to each person's specific needs and situation."},
    {n:5,title:"Consistency", body:"AI applies the same process or standard every time, reducing the variability that creeps into manual work."},
    {n:6,title:"Early Pattern Detection", body:"AI can surface patterns across large amounts of information that a person would otherwise miss or catch too late."},
    {n:7,title:"Augmented Decision-Making", body:"AI can give people more or better information to make a final judgment call — without replacing their judgment."},
    {n:8,title:"Cost Reduction", body:"Automating routine work with AI can meaningfully reduce time and cost over time."},
    {n:9,title:"Accessibility", body:"Tools like translation, transcription, and text-to-speech can make information and experiences reachable to more people."},
    {n:10,title:"Frees People for Higher-Value Work", body:"Removing repetitive tasks lets people focus their time on judgment, relationships, creativity, and strategy."},
    {n:11,title:"Faster Iteration", body:"AI can quickly generate drafts or options, speeding up creative work and planning."},
    {n:12,title:"Data-Driven Insight", body:"AI can synthesize large, complex, or scattered information into something clear and usable."}
  ];

  var DECISIONS = [
    {title:"TO AI", body:"Use AI for this, largely as-is.", cls:"to-ai"},
    {title:"NOT TO AI", body:"Keep this fully human. Do not use AI here.", cls:"not-ai"},
    {title:"TO AI — WITH GUARDRAILS", body:"Use AI, but only with specific safeguards in place (e.g. human review, disclosure, audit, opt-out).", cls:"guardrails"}
  ];

  var STORAGE_KEY = "aiUseCaseReview_draft_v1";
  var STEP_LABELS = ["Setup","Risks","Opportunities","Decision","Report"];
  var saveTimer = null;
  var pendingResumeState = null;

  function todayISO(){
    var d = new Date();
    var m = String(d.getMonth()+1).padStart(2,"0");
    var day = String(d.getDate()).padStart(2,"0");
    return d.getFullYear()+"-"+m+"-"+day;
  }

  function defaultState(){
    var risks = {}, opps = {};
    RISKS.forEach(function(r){ risks[r.n] = {applies:false, rating:"", notes:""}; });
    OPPORTUNITIES.forEach(function(o){ opps[o.n] = {applies:false, rating:"", notes:""}; });
    return {
      reviewer:"",
      date: todayISO(),
      useCase:"",
      risks: risks,
      opportunities: opps,
      decisionIndex: null,
      guardrail:"",
      step:1
    };
  }

  var state = defaultState();

  function escapeHtml(str){
    return String(str==null?"":str).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }

  function mergeWithDefaults(saved){
    var base = defaultState();
    if(!saved || typeof saved !== "object") return base;
    base.reviewer = typeof saved.reviewer === "string" ? saved.reviewer : base.reviewer;
    base.date = typeof saved.date === "string" && saved.date ? saved.date : base.date;
    base.useCase = typeof saved.useCase === "string" ? saved.useCase : base.useCase;
    base.decisionIndex = (saved.decisionIndex === 0 || saved.decisionIndex === 1 || saved.decisionIndex === 2) ? saved.decisionIndex : null;
    base.guardrail = typeof saved.guardrail === "string" ? saved.guardrail : base.guardrail;
    base.step = (typeof saved.step === "number" && saved.step >=1 && saved.step <=5) ? saved.step : 1;
    RISKS.forEach(function(r){
      if(saved.risks && saved.risks[r.n]){
        var s = saved.risks[r.n];
        base.risks[r.n] = {
          applies: !!s.applies,
          rating: ["Low","Med","High"].indexOf(s.rating) !== -1 ? s.rating : "",
          notes: typeof s.notes === "string" ? s.notes : ""
        };
      }
    });
    OPPORTUNITIES.forEach(function(o){
      if(saved.opportunities && saved.opportunities[o.n]){
        var s = saved.opportunities[o.n];
        base.opportunities[o.n] = {
          applies: !!s.applies,
          rating: ["Low","Med","High"].indexOf(s.rating) !== -1 ? s.rating : "",
          notes: typeof s.notes === "string" ? s.notes : ""
        };
      }
    });
    return base;
  }

  function hasMeaningfulContent(s){
    if(!s) return false;
    if(s.useCase && s.useCase.trim()) return true;
    if(s.reviewer && s.reviewer.trim()) return true;
    if(s.risks && Object.keys(s.risks).some(function(k){ return s.risks[k] && s.risks[k].applies; })) return true;
    if(s.opportunities && Object.keys(s.opportunities).some(function(k){ return s.opportunities[k] && s.opportunities[k].applies; })) return true;
    if(s.decisionIndex === 0 || s.decisionIndex === 1 || s.decisionIndex === 2) return true;
    return false;
  }

  function saveDraft(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){ /* storage unavailable — ignore */ }
  }
  function saveDraftDebounced(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveDraft, 250);
  }

  function isGuardrailIndex(idx){
    return idx === 2 && DECISIONS[2].cls === "guardrails";
  }

  function computeSummary(){
    var risksFlagged = RISKS.filter(function(r){ return state.risks[r.n].applies; });
    var risksHigh = risksFlagged.filter(function(r){ return state.risks[r.n].rating === "High"; }).length;
    var oppsFlagged = OPPORTUNITIES.filter(function(o){ return state.opportunities[o.n].applies; });
    var oppsHigh = oppsFlagged.filter(function(o){ return state.opportunities[o.n].rating === "High"; }).length;
    return {
      risksFlaggedCount: risksFlagged.length,
      risksHigh: risksHigh,
      oppsFlaggedCount: oppsFlagged.length,
      oppsHigh: oppsHigh
    };
  }

  function ratingRank(r){ return r === "High" ? 0 : r === "Med" ? 1 : r === "Low" ? 2 : 3; }

  // ---------------- Rendering ----------------

  var stepContainer = document.getElementById("stepContainer");
  var progressWrap = document.getElementById("progressWrap");
  var backBtn = document.getElementById("backBtn");
  var nextBtn = document.getElementById("nextBtn");
  var validationMsg = document.getElementById("validationMsg");
  var sidebar = document.getElementById("sidebar");
  var sidebarInner = document.getElementById("sidebarInner");
  var sidebarToggle = document.getElementById("sidebarToggle");
  var sidebarScrim = document.getElementById("sidebarScrim");
  var sidebarOpen = (typeof window === "undefined") ? true : window.innerWidth >= 881;

  function renderProgress(){
    var fillPct = ((state.step-1)/4*100);
    var stepsHtml = STEP_LABELS.map(function(label,i){
      var num = i+1;
      var cls = state.step === num ? "current" : (state.step > num ? "done" : "");
      return '<div class="progress-step '+cls+'"><span class="dot">'+(state.step>num? "✓" : num)+'</span><span class="label">'+label+'</span></div>';
    }).join("");
    progressWrap.innerHTML =
      '<div class="progress-track"><div class="progress-fill" style="width:'+fillPct+'%"></div></div>'+
      '<div class="progress-steps">'+stepsHtml+'</div>';
  }

  function sidebarMiniList(kindClass, storeKey, list, emptyText, jumpStep){
    var flagged = list.filter(function(item){ return state[storeKey][item.n].applies; });
    if(flagged.length === 0){
      return '<p class="sidebar-empty">'+emptyText+'</p>';
    }
    flagged = flagged.slice().sort(function(a,b){
      return ratingRank(state[storeKey][a.n].rating) - ratingRank(state[storeKey][b.n].rating);
    });
    var itemsHtml = flagged.map(function(item){
      var st = state[storeKey][item.n];
      var badgeCls = st.rating === "High" ? "high" : st.rating === "Med" ? "med" : "low";
      return (
        '<button type="button" class="sidebar-item '+kindClass+'" data-jump-step="'+jumpStep+'">'+
          '<span class="badge '+badgeCls+' sidebar-badge">'+(st.rating || "—")+'</span>'+
          '<span class="sidebar-item-title">'+escapeHtml(item.title)+'</span>'+
        '</button>'
      );
    }).join("");
    return '<div class="sidebar-list">'+itemsHtml+'</div>';
  }

  function renderSidebar(){
    var risksFlaggedCount = RISKS.filter(function(r){ return state.risks[r.n].applies; }).length;
    var oppsFlaggedCount = OPPORTUNITIES.filter(function(o){ return state.opportunities[o.n].applies; }).length;

    var useCaseHtml = state.useCase.trim()
      ? escapeHtml(state.useCase.trim())
      : '<span class="sidebar-empty">Not described yet — tap to add it</span>';

    var decisionHtml;
    if(state.decisionIndex !== null){
      var decision = DECISIONS[state.decisionIndex];
      var guardrailHtml = "";
      if(isGuardrailIndex(state.decisionIndex) && state.guardrail.trim()){
        guardrailHtml = '<p class="sidebar-guardrail">'+escapeHtml(state.guardrail.trim())+'</p>';
      }
      decisionHtml =
        '<button type="button" class="sidebar-decision-chip '+decision.cls+'" data-jump-step="4">'+escapeHtml(decision.title)+'</button>'+
        guardrailHtml;
    } else {
      decisionHtml = '<button type="button" class="sidebar-usecase" data-jump-step="4"><span class="sidebar-empty">Not decided yet — tap to decide</span></button>';
    }

    return (
      '<div class="sidebar-header">'+
        '<span class="sidebar-kicker">Review Snapshot</span>'+
        '<button type="button" class="sidebar-close" id="sidebarClose" aria-label="Close review snapshot">&times;</button>'+
      '</div>'+
      '<div class="sidebar-block">'+
        '<label class="sidebar-label">Use Case</label>'+
        '<button type="button" class="sidebar-usecase" data-jump-step="1">'+useCaseHtml+'</button>'+
      '</div>'+
      '<div class="sidebar-block">'+
        '<label class="sidebar-label">Risks Flagged ('+risksFlaggedCount+'/'+RISKS.length+')</label>'+
        sidebarMiniList("risk","risks",RISKS,"No risks flagged yet",2)+
      '</div>'+
      '<div class="sidebar-block">'+
        '<label class="sidebar-label">Opportunities Flagged ('+oppsFlaggedCount+'/'+OPPORTUNITIES.length+')</label>'+
        sidebarMiniList("opp","opportunities",OPPORTUNITIES,"No opportunities flagged yet",3)+
      '</div>'+
      '<div class="sidebar-block">'+
        '<label class="sidebar-label">Decision</label>'+
        decisionHtml+
      '</div>'
    );
  }

  function refreshSidebar(){
    sidebarInner.innerHTML = renderSidebar();
  }

  function syncSidebarOffset(){
    if(window.innerWidth >= 881){
      var h = progressWrap.offsetHeight;
      sidebar.style.top = h + "px";
      sidebar.style.maxHeight = "calc(100vh - " + h + "px)";
    } else {
      sidebar.style.top = "";
      sidebar.style.maxHeight = "";
    }
  }

  function applySidebarState(){
    if(sidebarOpen){
      sidebar.classList.add("open");
      sidebarScrim.classList.toggle("show", window.innerWidth <= 880);
      sidebarToggle.setAttribute("aria-expanded","true");
    } else {
      sidebar.classList.remove("open");
      sidebarScrim.classList.remove("show");
      sidebarToggle.setAttribute("aria-expanded","false");
    }
    syncSidebarOffset();
  }

  sidebarToggle.addEventListener("click", function(){
    sidebarOpen = !sidebarOpen;
    applySidebarState();
  });
  sidebarScrim.addEventListener("click", function(){
    sidebarOpen = false;
    applySidebarState();
  });
  window.addEventListener("resize", syncSidebarOffset);

  sidebarInner.addEventListener("click", function(e){
    if(e.target.id === "sidebarClose"){
      sidebarOpen = false;
      applySidebarState();
      return;
    }
    var jumpEl = e.target.closest("[data-jump-step]");
    if(jumpEl){
      var targetStep = parseInt(jumpEl.dataset.jumpStep, 10);
      state.step = targetStep;
      renderAll();
      scrollTop();
      if(window.innerWidth <= 880){
        sidebarOpen = false;
        applySidebarState();
      }
    }
  });

  function itemCard(storeKey, item){
    var st = state[storeKey][item.n];
    var kindClass = storeKey === "risks" ? "risk" : "opp";
    var ratingLabel = storeKey === "risks" ? "Severity" : "Value if Realized";
    var idBase = kindClass + "-" + item.n;
    var detail = "";
    if(st.applies){
      var segs = ["Low","Med","High"].map(function(v){
        var rid = idBase + "-" + v;
        return '<input type="radio" class="sr-radio" id="'+rid+'" name="'+idBase+'-rating" '+
               'data-kind="'+storeKey+'" data-n="'+item.n+'" data-field="rating" value="'+v+'" '+(st.rating===v?"checked":"")+'>'+
               '<label for="'+rid+'" class="seg-btn">'+v+'</label>';
      }).join("");
      detail =
        '<div class="item-detail">'+
          '<div class="seg-group" role="radiogroup" aria-label="'+ratingLabel+' for '+escapeHtml(item.title)+'">'+
            '<span class="seg-label">'+ratingLabel+':</span>'+segs+
          '</div>'+
          '<label class="notes-label" for="'+idBase+'-notes">Notes</label>'+
          '<input type="text" id="'+idBase+'-notes" class="notes-input" data-kind="'+storeKey+'" data-n="'+item.n+'" data-field="notes" '+
            'value="'+escapeHtml(st.notes)+'" placeholder="Optional notes on how this applies...">'+
        '</div>';
    }
    return (
      '<div class="item-card '+kindClass+(st.applies?" applied":"")+'">'+
        '<label class="item-head">'+
          '<input type="checkbox" data-kind="'+storeKey+'" data-n="'+item.n+'" data-field="applies" '+(st.applies?"checked":"")+' aria-describedby="'+idBase+'-body">'+
          '<span class="item-num">'+item.n+'</span>'+
          '<span class="item-title">'+escapeHtml(item.title)+'</span>'+
        '</label>'+
        '<p class="item-body" id="'+idBase+'-body">'+escapeHtml(item.body)+'</p>'+
        detail+
      '</div>'
    );
  }

  var STEP_RENDERERS = {
    1: function(){
      return (
        '<h2 class="step-heading">Step 1 &middot; Setup</h2>'+
        '<p class="step-intro">Start by naming who\'s reviewing and describing the specific real AI use case you\'re thinking through.</p>'+
        '<div class="two-col">'+
          '<div class="field-group">'+
            '<label class="field-label" for="reviewerName">Reviewer name(s)</label>'+
            '<input type="text" id="reviewerName" value="'+escapeHtml(state.reviewer)+'" placeholder="e.g. Jordan Cruz">'+
          '</div>'+
          '<div class="field-group">'+
            '<label class="field-label" for="reviewDate">Date</label>'+
            '<input type="date" id="reviewDate" value="'+escapeHtml(state.date)+'">'+
          '</div>'+
        '</div>'+
        '<div class="field-group">'+
          '<label class="field-label" for="useCaseText">The use case being reviewed <span style="color:var(--risk)">*</span></label>'+
          '<textarea id="useCaseText" placeholder="Describe the specific real AI use case under consideration in a few sentences — what would it do, who would use it, and for what?">'+escapeHtml(state.useCase)+'</textarea>'+
          '<div class="field-hint">This is the only required field. Everything else in this review is built around what you describe here.</div>'+
        '</div>'
      );
    },
    2: function(){
      return (
        '<h2 class="step-heading">Step 2 &middot; Risk Checklist</h2>'+
        '<p class="step-intro">Review all 14 risk concepts below. Check any that apply to your use case, then rate their severity and add a short note.</p>'+
        RISKS.map(function(r){ return itemCard("risks", r); }).join("")
      );
    },
    3: function(){
      return (
        '<h2 class="step-heading">Step 3 &middot; Opportunity Checklist</h2>'+
        '<p class="step-intro">Review all 12 opportunity concepts below. Check any that apply, then rate the value if realized and add a short note.</p>'+
        OPPORTUNITIES.map(function(o){ return itemCard("opportunities", o); }).join("")
      );
    },
    4: function(){
      var sum = computeSummary();
      var decisionCards = DECISIONS.map(function(d, idx){
        var selected = state.decisionIndex === idx;
        return (
          '<div class="decision-card '+d.cls+(selected?" selected":"")+'" data-index="'+idx+'" role="button" tabindex="0" aria-pressed="'+selected+'">'+
            '<h3><span class="decision-check">'+(selected?"✓":"")+'</span>'+escapeHtml(d.title)+'</h3>'+
            '<p>'+escapeHtml(d.body)+'</p>'+
          '</div>'
        );
      }).join("");
      var guardrailBlock = "";
      if(isGuardrailIndex(state.decisionIndex)){
        guardrailBlock =
          '<div class="guardrail-field">'+
            '<label class="field-label" for="guardrailText">What’s the specific guardrail? <span style="color:var(--risk)">*</span></label>'+
            '<textarea id="guardrailText" placeholder="Be specific — e.g. “Require human sign-off before any AI-drafted email is sent to a customer” or “Disclose AI involvement in the final output.”">'+escapeHtml(state.guardrail)+'</textarea>'+
          '</div>';
      }
      return (
        '<h2 class="step-heading">Step 4 &middot; Decision</h2>'+
        '<p class="step-intro">Based on what you flagged, decide how to proceed. This tool doesn\'t have an answer key — the summary below is informational only.</p>'+
        '<div class="summary-box">'+
          '<strong>'+sum.risksFlaggedCount+' of '+RISKS.length+'</strong> risks flagged ('+sum.risksHigh+' rated High) &nbsp;&middot;&nbsp; '+
          '<strong>'+sum.oppsFlaggedCount+' of '+OPPORTUNITIES.length+'</strong> opportunities flagged ('+sum.oppsHigh+' rated High)'+
          '<span class="disclaimer">This is a summary of what you flagged, not a recommendation or verdict. The decision below is yours to make.</span>'+
        '</div>'+
        '<div class="decision-cards">'+decisionCards+'</div>'+
        guardrailBlock
      );
    },
    5: function(){
      return renderReportStep();
    }
  };

  function reportSectionHtml(kind, list, storeKey, label){
    var flagged = list.filter(function(item){ return state[storeKey][item.n].applies; });
    if(flagged.length === 0){
      return '<div class="report-section"><h3>'+label+'</h3><p class="empty-note">No '+label.toLowerCase()+' were flagged for this use case.</p></div>';
    }
    flagged.sort(function(a,b){ return ratingRank(state[storeKey][a.n].rating) - ratingRank(state[storeKey][b.n].rating); });
    var itemsHtml = flagged.map(function(item){
      var st = state[storeKey][item.n];
      var badgeCls = st.rating === "High" ? "high" : st.rating === "Med" ? "med" : "low";
      var ratingText = st.rating || "Not rated";
      var notes = st.notes && st.notes.trim() ? '<div class="report-item-notes">'+escapeHtml(st.notes)+'</div>' : "";
      return (
        '<div class="report-item '+kind+'">'+
          '<div class="report-item-title"><span class="badge '+badgeCls+'">'+ratingText+'</span> '+escapeHtml(item.title)+'</div>'+
          notes+
        '</div>'
      );
    }).join("");
    return '<div class="report-section"><h3>'+label+'</h3>'+itemsHtml+'</div>';
  }

  function renderReportStep(){
    var sum = computeSummary();
    var decision = state.decisionIndex !== null ? DECISIONS[state.decisionIndex] : null;
    var guardrailHtml = "";
    if(decision && isGuardrailIndex(state.decisionIndex) && state.guardrail.trim()){
      guardrailHtml = '<div class="guardrail-callout"><span class="k">Guardrail</span>'+escapeHtml(state.guardrail)+'</div>';
    }
    var decisionHtml = decision
      ? '<div class="decision-report-box"><h4>'+escapeHtml(decision.title)+'</h4><p style="margin:0;color:var(--muted)">'+escapeHtml(decision.body)+'</p>'+guardrailHtml+'</div>'
      : '<p class="empty-note">No decision was recorded.</p>';

    return (
      '<h2 class="step-heading no-print">Step 5 &middot; Report</h2>'+
      '<div class="report-actions no-print">'+
        '<button class="btn btn-primary" id="printReportBtn" type="button">Print / Save as PDF</button>'+
        '<button class="btn btn-secondary" id="copyReportBtn" type="button">Copy summary as text</button>'+
        '<button class="btn btn-secondary" id="startNewBtn2" type="button">Start New Review</button>'+
      '</div>'+
      '<div class="report-page" id="reportPage">'+
        '<h2>AI Use Case Review Report</h2>'+
        '<div class="report-meta">'+
          '<div><div class="k">Reviewer</div><div class="v">'+escapeHtml(state.reviewer || "—")+'</div></div>'+
          '<div><div class="k">Date</div><div class="v">'+escapeHtml(state.date || "—")+'</div></div>'+
          '<div class="full"><div class="k">Use Case Reviewed</div><div class="v">'+escapeHtml(state.useCase || "—")+'</div></div>'+
        '</div>'+
        '<div class="report-summary">'+
          '<strong>'+sum.risksFlaggedCount+' of '+RISKS.length+'</strong> risks flagged ('+sum.risksHigh+' High) &nbsp;&middot;&nbsp; '+
          '<strong>'+sum.oppsFlaggedCount+' of '+OPPORTUNITIES.length+'</strong> opportunities flagged ('+sum.oppsHigh+' High)'+
        '</div>'+
        reportSectionHtml("risk", RISKS, "risks", "Risks Identified")+
        reportSectionHtml("opp", OPPORTUNITIES, "opportunities", "Opportunities Identified")+
        '<div class="report-section"><h3>Decision</h3>'+decisionHtml+'</div>'+
      '</div>'
    );
  }

  function buildReportText(){
    var sum = computeSummary();
    var lines = [];
    lines.push("AI USE CASE REVIEW REPORT");
    lines.push("");
    lines.push("Reviewer: " + (state.reviewer || "—"));
    lines.push("Date: " + (state.date || "—"));
    lines.push("Use Case Reviewed: " + (state.useCase || "—"));
    lines.push("");
    lines.push("SUMMARY");
    lines.push(sum.risksFlaggedCount + " of " + RISKS.length + " risks flagged (" + sum.risksHigh + " rated High)");
    lines.push(sum.oppsFlaggedCount + " of " + OPPORTUNITIES.length + " opportunities flagged (" + sum.oppsHigh + " rated High)");
    lines.push("");

    lines.push("RISKS IDENTIFIED");
    var flaggedRisks = RISKS.filter(function(r){ return state.risks[r.n].applies; });
    if(flaggedRisks.length === 0){
      lines.push("None flagged.");
    } else {
      flaggedRisks.sort(function(a,b){ return ratingRank(state.risks[a.n].rating) - ratingRank(state.risks[b.n].rating); });
      flaggedRisks.forEach(function(r){
        var st = state.risks[r.n];
        var line = "- [" + (st.rating || "Not rated") + "] " + r.title;
        if(st.notes && st.notes.trim()) line += " — " + st.notes.trim();
        lines.push(line);
      });
    }
    lines.push("");

    lines.push("OPPORTUNITIES IDENTIFIED");
    var flaggedOpps = OPPORTUNITIES.filter(function(o){ return state.opportunities[o.n].applies; });
    if(flaggedOpps.length === 0){
      lines.push("None flagged.");
    } else {
      flaggedOpps.sort(function(a,b){ return ratingRank(state.opportunities[a.n].rating) - ratingRank(state.opportunities[b.n].rating); });
      flaggedOpps.forEach(function(o){
        var st = state.opportunities[o.n];
        var line = "- [" + (st.rating || "Not rated") + "] " + o.title;
        if(st.notes && st.notes.trim()) line += " — " + st.notes.trim();
        lines.push(line);
      });
    }
    lines.push("");

    lines.push("DECISION");
    if(state.decisionIndex !== null){
      var d = DECISIONS[state.decisionIndex];
      lines.push(d.title + " — " + d.body);
      if(isGuardrailIndex(state.decisionIndex) && state.guardrail.trim()){
        lines.push("Guardrail: " + state.guardrail.trim());
      }
    } else {
      lines.push("No decision recorded.");
    }

    return lines.join("\n");
  }

  function renderStep(){
    stepContainer.innerHTML = STEP_RENDERERS[state.step]();
  }

  function updateFooter(){
    backBtn.disabled = state.step === 1;
    if(state.step === 5){
      nextBtn.setAttribute("hidden","");
    } else {
      nextBtn.removeAttribute("hidden");
      nextBtn.textContent = state.step === 4 ? "Generate Report" : "Next";
    }
    validationMsg.textContent = "";
  }

  function renderAll(){
    renderProgress();
    renderStep();
    updateFooter();
    refreshSidebar();
    syncSidebarOffset();
  }

  function scrollTop(){
    window.scrollTo({top:0, behavior:"instant" in window ? "instant" : "auto"});
  }

  // ---------------- Validation & Navigation ----------------

  function validateStep(step){
    if(step === 1){
      return state.useCase.trim().length > 0;
    }
    if(step === 4){
      if(state.decisionIndex === null) return false;
      if(isGuardrailIndex(state.decisionIndex) && !state.guardrail.trim()) return false;
      return true;
    }
    return true;
  }

  function validationMessageFor(step){
    if(step === 1) return "Please describe the use case before continuing.";
    if(step === 4){
      if(state.decisionIndex === null) return "Please select a decision.";
      if(isGuardrailIndex(state.decisionIndex) && !state.guardrail.trim()) return "Please describe the specific guardrail.";
    }
    return "";
  }

  backBtn.addEventListener("click", function(){
    if(state.step > 1){
      state.step -= 1;
      renderAll();
      saveDraft();
      scrollTop();
    }
  });

  nextBtn.addEventListener("click", function(){
    if(validateStep(state.step)){
      if(state.step < 5){
        state.step += 1;
        renderAll();
        saveDraft();
        scrollTop();
      }
    } else {
      validationMsg.textContent = validationMessageFor(state.step);
    }
  });

  // ---------------- Delegated events on step content ----------------

  stepContainer.addEventListener("input", function(e){
    var t = e.target;
    if(t.id === "reviewerName"){ state.reviewer = t.value; saveDraftDebounced(); return; }
    if(t.id === "reviewDate"){ state.date = t.value; saveDraftDebounced(); return; }
    if(t.id === "useCaseText"){
      state.useCase = t.value;
      if(state.useCase.trim().length > 0) validationMsg.textContent = "";
      refreshSidebar();
      saveDraftDebounced();
      return;
    }
    if(t.id === "guardrailText"){
      state.guardrail = t.value;
      if(state.guardrail.trim().length > 0) validationMsg.textContent = "";
      refreshSidebar();
      saveDraftDebounced();
      return;
    }
    if(t.dataset && t.dataset.field === "notes"){
      var store = state[t.dataset.kind];
      store[t.dataset.n].notes = t.value;
      saveDraftDebounced();
      return;
    }
  });

  stepContainer.addEventListener("change", function(e){
    var t = e.target;
    if(t.dataset && t.dataset.field === "applies"){
      var store = state[t.dataset.kind];
      var item = store[t.dataset.n];
      item.applies = t.checked;
      if(item.applies && !item.rating) item.rating = "Med";
      renderStep();
      refreshSidebar();
      saveDraft();
      return;
    }
    if(t.dataset && t.dataset.field === "rating"){
      var store2 = state[t.dataset.kind];
      store2[t.dataset.n].rating = t.value;
      refreshSidebar();
      saveDraft();
      return;
    }
    if(t.id === "reviewDate"){
      state.date = t.value;
      saveDraft();
      return;
    }
  });

  function selectDecision(idx){
    state.decisionIndex = idx;
    if(!isGuardrailIndex(idx)) state.guardrail = "";
    validationMsg.textContent = "";
    renderStep();
    refreshSidebar();
    saveDraft();
  }

  stepContainer.addEventListener("click", function(e){
    var card = e.target.closest(".decision-card");
    if(card){
      selectDecision(parseInt(card.dataset.index, 10));
      return;
    }
    if(e.target.id === "printReportBtn"){
      window.print();
      return;
    }
    if(e.target.id === "copyReportBtn"){
      copyReportToClipboard();
      return;
    }
    if(e.target.id === "startNewBtn2"){
      resetReview();
      return;
    }
  });

  stepContainer.addEventListener("keydown", function(e){
    if((e.key === "Enter" || e.key === " ") && e.target.classList.contains("decision-card")){
      e.preventDefault();
      selectDecision(parseInt(e.target.dataset.index, 10));
    }
  });

  // ---------------- Copy / Toast ----------------

  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.hidden = true; }, 2400);
  }

  function fallbackCopy(text){
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try{ document.execCommand("copy"); showToast("Copied to clipboard"); }
    catch(e){ showToast("Copy failed — please select and copy manually."); }
    document.body.removeChild(ta);
  }

  function copyReportToClipboard(){
    var text = buildReportText();
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){
        showToast("Copied to clipboard");
      }).catch(function(){ fallbackCopy(text); });
    } else {
      fallbackCopy(text);
    }
  }

  // ---------------- Reset / Resume ----------------

  var resumeModal = document.getElementById("resumeModal");

  function resetReview(){
    if(window.confirm("Start a new review? This will clear all current answers.")){
      try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
      state = defaultState();
      renderAll();
      scrollTop();
    }
  }

  document.getElementById("headerResetBtn").addEventListener("click", resetReview);

  document.getElementById("resumeBtn").addEventListener("click", function(){
    state = pendingResumeState || defaultState();
    resumeModal.hidden = true;
    renderAll();
  });

  document.getElementById("startFreshBtn").addEventListener("click", function(){
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
    state = defaultState();
    resumeModal.hidden = true;
    renderAll();
  });

  // ---------------- Init ----------------

  function init(){
    var raw = null;
    try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){}
    var saved = null;
    if(raw){
      try{ saved = mergeWithDefaults(JSON.parse(raw)); }catch(e){ saved = null; }
    }
    if(saved && hasMeaningfulContent(saved)){
      pendingResumeState = saved;
      state = defaultState();
      resumeModal.hidden = false;
    } else {
      state = saved || defaultState();
    }
    renderAll();
    applySidebarState();
  }

  init();
})();
</script>
</body>
</html>
